name: test

on:
  pull_request:
  # "Run workflow" on a branch runs everything, including the slow integration
  # jobs that pull requests skip.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/reusable-test.yml
    with:
      integration: ${{ github.event_name == 'workflow_dispatch' }}
